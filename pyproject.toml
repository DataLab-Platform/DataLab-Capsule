[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datalab-capsule"
dynamic = ["version"]
description = "Exchange and verify scientific workspace provenance as open RO-Crate capsules (library and CLI, no DataLab required)"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "DataLab Platform Developers" }]
requires-python = ">=3.10, <4"
dependencies = ["jsonschema >= 4.17"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/DataLab-Platform/DataLab-Capsule"

[project.scripts]
workspace-capsule = "datalab_capsule.cli:main"
workspace-capsule-registry = "datalab_capsule.cli:registry_main"

[project.optional-dependencies]
hdf5 = ["NumPy >= 1.22", "h5py >= 3.6"]
registry = ["fastapi >= 0.110", "uvicorn >= 0.27"]
test = ["pytest >= 7", "NumPy >= 1.22", "h5py >= 3.6", "httpx >= 0.27"]
dev = ["ruff"]

[tool.setuptools.dynamic]
version = { attr = "datalab_capsule.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datalab_capsule = ["schemas/*.json", "contexts/*.jsonld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
exclude = [".git", ".vscode", "build", "dist", "venv*", ".venv*", "node_modules"]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["D202", "D403", "E", "F", "I", "NPY201", "RUF022", "W"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"
